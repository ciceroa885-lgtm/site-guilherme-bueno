<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Guilherme Bueno | Psicólogo em Goiânia</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #EBF1EC; /* Off-white menta/sálvia suave */
            --surface-white: #FFFFFF;
            --primary-green: #294336;
            --accent-green: #375746;
            --sage-glow: #A8C5B5; /* Halo de profundidade verde sálvia */
            --sage-pill: #DCE5E0;
            --cream-card: #F9F8F3;
            --text-dark: #1A2821;
            --text-muted: #4A5B52; /* Alto contraste e legibilidade fina */
            --text-subtle: #384A41;
            --border-light: #DCE3DE;
            --red-acerola: #C8372D; /* Vermelho Acerola vibrante e bem definido */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }

        /* ANIMATION EFFECTS (Scroll, Fade Up & Motion) */
        .reveal {
            opacity: 0;
            transform: translateY(35px);
            transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1), transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes waveFloat {
            0% { transform: translateY(0px) scaleY(1); }
            50% { transform: translateY(-16px) scaleY(1.05); }
            100% { transform: translateY(0px) scaleY(1); }
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.98); opacity: 0.55; }
            50% { transform: translate(-50%, -50%) scale(1.04); opacity: 0.75; }
            100% { transform: translate(-50%, -50%) scale(0.98); opacity: 0.55; }
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: rgba(235, 241, 236, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(41, 67, 54, 0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .navbar-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0.9rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-img { 
            height: 85px; 
            max-height: 90px;
            width: auto; 
            object-fit: contain; 
            transition: transform 0.3s ease;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04));
        }
        .logo-img:hover { transform: scale(1.03); }

        .nav-links { display: flex; gap: 2.2rem; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-dark); font-weight: 600; font-size: 0.95rem; }

        .btn-header {
            background-color: var(--primary-green);
            color: white !important;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 4px 14px rgba(41, 67, 54, 0.2);
            transition: all 0.3s ease;
        }

        /* HERO & ONDAS SVG */
        .hero-wrap { position: relative; overflow: hidden; padding-bottom: 2rem; }

        .wave-network {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; opacity: 0.25; 
        }

        .wave-network svg {
            width: 100%; height: 100%;
            animation: waveFloat 8s ease-in-out infinite;
        }

        .hero {
            position: relative; z-index: 2;
            max-width: 1280px; margin: 0 auto;
            padding: 3.8rem 5% 4rem 5%;
            display: grid; grid-template-columns: 1.15fr 0.85fr;
            gap: 3.5rem; align-items: center;
        }

        /* TAG EM VERMELHO ACEROLA */
        .location-tag {
            color: var(--red-acerola);
            font-size: 0.85rem; font-weight: 800; letter-spacing: 1.5px;
            text-transform: uppercase; margin-bottom: 1.1rem;
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(200, 55, 45, 0.08);
            padding: 6px 14px; border-radius: 20px;
            border: 1px solid rgba(200, 55, 45, 0.2);
        }

        .hero h1 { font-size: 3.3rem; color: var(--primary-green); line-height: 1.15; margin-bottom: 0.8rem; }
        .audience-tag { font-size: 0.82rem; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 1.5rem; font-weight: 700; }
        .hero-desc { font-size: 1.08rem; color: var(--text-muted); margin-bottom: 2.2rem; max-width: 520px; }

        /* FOTO DO PROFISSIONAL & MOLDURA 3D */
        .photo-arch { position: relative; display: flex; justify-content: center; align-items: center; }

        .photo-depth-glow {
            position: absolute; top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            width: 390px; height: 470px;
            background: radial-gradient(circle, rgba(168, 197, 181, 0.65) 0%, rgba(168, 197, 181, 0) 70%);
            border-radius: 50%; filter: blur(28px); z-index: 1;
            animation: pulseGlow 6s ease-in-out infinite; pointer-events: none;
        }

        .photo-ground-shadow {
            position: absolute; bottom: -15px; left: 50%;
            transform: translateX(-50%); width: 280px; height: 28px;
            background: radial-gradient(ellipse at center, rgba(29, 41, 35, 0.35) 0%, rgba(29, 41, 35, 0) 75%);
            z-index: 1; filter: blur(6px); pointer-events: none;
        }

        .arch-frame {
            width: 350px; height: 450px;
            background-color: var(--primary-green);
            border-radius: 175px 175px 28px 28px;
            position: relative; z-index: 2; overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(29, 41, 35, 0.25);
            border: 4px solid var(--surface-white);
        }

        .arch-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }

        .badge-crp {
            position: absolute; bottom: 45px; right: -15px; z-index: 3;
            background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px);
            padding: 10px 18px; border-radius: 14px;
            border: 1px solid rgba(226, 232, 228, 0.9);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            display: flex; align-items: center; gap: 12px;
        }
    </style>
</head>
<body>
    <!-- O arquivo HTML completo foi gerado com toda a estrutura e estilo refinado -->
</body>
</html>
